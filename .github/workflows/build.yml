name: Build

on:
  push:
  pull_request:

jobs:
  build:
    name: ${{ matrix.name }} ${{ matrix.build_type }} ${{ matrix.linking }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        build_type: [Debug, Release]
        linking: [shared, static]
        name: [Linux GCC, Linux Clang, macOS, Windows MSVC]
        include:
          - name: Linux GCC
            os: ubuntu-latest
            cc: gcc
            cxx: g++
          - name: Linux Clang
            os: ubuntu-latest
            cc: clang
            cxx: clang++
          - name: macOS
            os: macos-latest
          - name: Windows MSVC
            os: windows-latest

    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libgl-dev libglu1-mesa-dev

      - name: Configure
        shell: bash
        run: |
          args=(-DCMAKE_BUILD_TYPE=${{ matrix.build_type }})
          if [ "${{ matrix.linking }}" = static ]; then args+=(-DVL_DYNAMIC_LINKING=OFF); fi
          if [ -n "${{ matrix.cc }}" ]; then args+=(-DCMAKE_C_COMPILER=${{ matrix.cc }} -DCMAKE_CXX_COMPILER=${{ matrix.cxx }}); fi
          cmake -S . -B build "${args[@]}"

      - name: Build
        run: cmake --build build --config ${{ matrix.build_type }} --parallel
